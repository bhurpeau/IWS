# G0.3 — Source des correspondances intervolumes (candidat, non normatif).
# notations/crosswalk.csv est GÉNÉRÉ à partir de ce fichier et du registre par notations/scripts/build_crosswalk.py.
#
# Orientation : toutes les relations sont lues du volume I (ou d'un compagnon, préfixe C.) vers le volume II :
#   ID   même objet dans le cadre indiqué
#   GEN  l'objet II généralise l'objet I (l'objet I en est un cas, une instance ou une spécialisation)
#   SPEC l'objet II spécialise l'objet I
#   PROJ l'objet II est obtenu par projection ou restriction de l'objet I (préciser l'application)
#   DER  l'objet II est dérivé de l'objet I (préciser la construction)
#   ANA  analogie sans identification établie
#   DIST objets distincts (relevé utile en cas d'homonymie ou de proximité trompeuse)
#   UNK  relation non déterminée
#   NEW  objet propre à un volume relativement au corpus étudié (champ « volume_propre »)
# statut : etablie (justifiée par les définitions et, le cas échéant, par un renvoi explicite du texte)
#          | candidate (plausible, conditions à vérifier ou à arbitrer par l'auteur) | indeterminee.
# Une relation entre familles n'entraîne aucune relation entre leurs composants.
# Les relations intravolume (portee: intravolume) répondent aux décisions D3 et à l'anomalie A-G02-08 ;
# elles ne sont pas des correspondances intervolumes.

meta:
  phase: G0.3
  date: '2026-11-28'
  registre: notations/registry.yaml (305 entrées après E5 ; références historiques 301 et 95 conservées)
  statut: candidat ; aucune notation canonique choisie ; aucun manuscrit modifié

