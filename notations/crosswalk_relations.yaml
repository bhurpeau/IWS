  statut: etablie
  confiance: haute
  conditions: "les écritures P^+_{i*}=r_P P^-_{i*} (livre I l. 626 ; livre II l. 1057 ; compagnon l. 35) et P^+_{i*}=r_PΘ (annexes A l. 969, B l. 750, C l. 205, E l. 564) définissent des opérateurs de saut qui coïncident exactement sur {x∈\\mathcal D_{i*} : P_{i*}=Θ} et diffèrent sur {P_{i*}>Θ} ; or, pour une condition initiale admissible (P_i(0)∈[0,Θ], livre I l. 759) : (a) pendant le flot P_i≤Θ et P_i est continue, donc le premier saut a lieu avec P_{i*}^-=Θ (livre I l. 552) ; (b) dans une cascade, les pressions des nœuds non encore traités ne changent pas et restent égales à Θ (livre I l. 652, 666–670) ; (c) après un saut P_{i*}^+=r_PΘ<Θ ; par récurrence, tout saut d'une exécution issue d'une condition initiale admissible vérifie P^-_{i*}=Θ ; les deux écritures produisent donc les mêmes exécutions sur ce domaine ; équivalence CONDITIONNELLE au domaine atteignable, non identité des opérateurs sur tout D ; décision E6 : équivalence conditionnelle acceptée pour le noyau lorsque P⁻=Θ ; sur les états où P⁻>Θ, les deux écritures diffèrent en général, sauf notamment si r_P=0 ; NON étendue automatiquement à R2 (livre II l. 1057, annexe E l. 564), dont la portée reste à instruire"
  justification: "A-G02-08 ; livre I l. 529–552, 626, 652–670, 759"

