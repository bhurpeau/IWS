- id: R001
  portee: intravolume
  I: I.II.APPROPRIATION
  I_cible: I.D.APPROPRIATION
  relation: ID
  statut: etablie
  confiance: haute
  conditions: "décision E6 : IDENTITÉ CONDITIONNELLE ÉTABLIE ENTRE LES PRÉDICATS, sans présumer l'identité inconditionnelle de leurs domaines d'application ; deux entrées conservées jusqu'à G0.5 ; les deux prédicats coïncident par substitution de y_T=Φ^T_{g,\\mathcal P}(z_0) et renommage de l'attracteur final (\\mathcal A ↔ \\mathcal A_1), SOUS LES CONDITIONS : (C1) même système receveur, sur la même réduction (dyade A→B, diagonale interne, livre II l. 114–207 ; annexe D l. 39–118) ; (C2) même application d'interaction Φ^T_{g,\\mathcal P} (même protocole \\mathcal P, même couplage g pendant T, puis découplage) ; (C3) même dynamique autonome après découplage, de sorte que ω_0 soit le même ensemble limite, défini sur le même domaine d'états ; (C4) même notion d'attracteur autonome : l'annexe D explicite (l. 1456) l'application aux régimes hybrides invariants (annexe C l. 1721), ce que le livre II ne précise pas ; l'identification vaut donc sans restriction pour les attracteurs que le livre II admet, et l'annexe D la prolonge explicitement aux attracteurs non ponctuels sans changer le prédicat ; ni identité inconditionnelle ni généralisation stricte n'est affirmée (D3)"
  justification: "livre II l. 619–665 ; annexe D l. 1406–1469 ; table des énoncés (renvoi « Ann. D.3 »)"
