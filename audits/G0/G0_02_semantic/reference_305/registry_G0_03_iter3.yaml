# Registre sémantique candidat — voir _meta. YAML 1.2 style bloc, généré par registry_io.py.
_meta:
  titre: 'Registre sémantique CANDIDAT INTERMÉDIAIRE — G0.3 (itération 3 : 305 entrées)'
  statut: candidat intermédiaire ; non normatif ; G0.2 clôturée (D1) ; enrichi en G0.3 (E5, 4 entrées)
  etat_reference: 'références historiques conservées : reference_95/ (G0.2, itération 1), reference_301/ (G0.2bis,
    D1) ; état courant figé en reference_305/ après intégration des arbitrages E2–E6'
  format: YAML 1.2 style bloc (PyYAML 6.0.2, environnement .venv-g0 ; notations/requirements-g0.txt) ; écrit par
    notations/scripts/registry_io.py
  commit_sources: c74fa047171ff51e308f1855d8f636add2ac33ca
  inventaire_reference: audits/G0/G0_01_inventory (commit 05afddd)
  regles:
  - 'Identifiant indépendant du glyphe ; préfixe de volume (I, II, C pour compagnons) : aucune identité intervolumes
    n''est établie (G0.3).'
  - Les champs type, domaine, codomaine ne sont renseignés que lorsqu'ils figurent dans la source ; sinon null.
  - 'statut_definition : EXPLICIT | IMPLICIT | AMBIGUOUS | UNDEFINED ; motif_statut justifie l''attribution.'
  - 'confiance : haute (passage définitionnel lu intégralement) | moyenne (passage lu partiellement ou définition
    dispersée) | faible (identification sur indices contextuels).'
  - 'notation_canonique : toujours vide en G0.2.'
  - 'selecteurs : critères lexicaux reliant l''objet aux occurrences de l''inventaire G0.1 (glyphe exact, indice/exposant
    en expression régulière, fichier, plage de lignes). Un sélecteur borne une portée ; il ne prouve pas l''identité
    de chaque occurrence.'
  - 'granularite : element | famille. Une famille organise des composants ; ses composants sont listés dans « composants
    » et renvoient à la famille par « familles ». Une famille sans composants porte « motif_granularite ». Les sélecteurs
    sont portés par les éléments.'
  - 'revisions : historique G0.2bis de chaque entrée (ajout, décomposition, requalification, correction, correction_selecteur,
    enrichissement, granularite).'
  - 'relations_intra : relations à l''intérieur d''un même volume (restriction, homonyme_a_instruire, meme_terme_definition_distincte…)
    ; aucune n''établit d''identité intervolumes.'
  - 'Sélecteurs : motifs de fichier ancrés (IWS_PART_I\.tex ne capte plus IWS_PART_II ni IWS_PART_III) ; champs
    « decoration » et « police » disponibles.'
  - 'provenance_definition : LOCAL (définition dans le passage), BY_REFERENCE (définition reprise par renvoi explicite
    à un autre volume ou à une annexe), DERIVED (objet défini par une construction explicite à partir d''objets
    déjà enregistrés : union, composition, restriction, préimage) ; attribut indépendant de statut_definition ;
    classement DERIVED indicatif (E5)'
