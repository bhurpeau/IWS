# G0.4 — Catalogue structuré des collisions (candidat, non normatif ; aucune notation canonique choisie).
# Exploité par notations/scripts/build_collisions.py, qui valide les identifiants, compte les occurrences
# (inventaire G0.1) et vérifie la couverture (50 clés ambiguës, relations DIST/ANA, synonymies ID, réservations V5.16).
#
# nature : HOMONYMIE (même notation, objets distincts) | SYNONYMIE (plusieurs notations, même objet) |
#          QUASI_COLLISION (proximité graphique ou conceptuelle) | AMBIGUITE (identification sémantique insuffisante)
# niveau (plan § 8, précisé par F1) : N0 réemploi local légitime | N1 collision graphique sans ambiguïté de rôle |
#          N2 collision sémantique dans une portée significative | N3 collision intervolumes entre objets distincts dont les
#          portées, rôles ou contextes sont assez proches pour compromettre l'interprétation du corpus commun |
#          N4 ambiguïté mathématique, définition absente ou types incompatibles
# Règle F1 : la réservation explicite d'une notation par le volume II est un facteur aggravant (champ facteur_aggravant) qui
#          fixe la priorité notationnelle à l'arbitrage ; elle n'est ni nécessaire ni suffisante pour N3.
#          Règle initiale de G0.4 (remplacée) : réservation ET (proximité OU portée partagée) ; niveaux modifiés : niveau_G04_initial.
# intervention : PRESERVER (réemploi légitime, aucune intervention) | DOCUMENTER (mention documentaire, texte inchangé) |
#          CORRECTION_CANDIDATE (correction évidente, soumise à validation) | A_ARBITRER (décision de G0.5)
#          N0–N1 n'impliquent pas d'intervention dans les manuscrits.
# portee : intra_I | intra_II | intra_C | inter (I↔II) | inter_C (compagnons↔II)
# categorie_correction : NOTATIONNELLE | TERMINOLOGIQUE | DOCUMENTAIRE | SCIENTIFIQUE (distincte, cf. A-G02-14/15)
# selecteurs : comptage des occurrences ; role = cote_a_examiner (côté susceptible d'être adapté) | reference (côté de référence)
#              forme : critères de l'inventaire (vol, glyphe, indice, exposant, fichier, lignes, decoration, niveau)
#              ou motif texte (vol, texte) compté dans les sources
# action_proposee : proposition sans arbitrage définitif (G0.5 décide).

